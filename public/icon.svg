<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="trailGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="trailGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Orbital / Radar Curves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Speed / Beam Trails -->
  <line x1="210" y1="410" x2="210" y2="340" stroke="url(#trailGrad1)" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="430" x2="256" y2="350" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="302" y1="410" x2="302" y2="340" stroke="url(#trailGrad2)" stroke-width="3" stroke-linecap="round"/>

  <!-- Supersonic Stealth Airplane (Airport / Navigation) -->
  <g filter="url(#glow)">
    <!-- Left Wing -->
    <polygon points="256,120 112,340 256,310" fill="url(#leftWing)" />
    <!-- Right Wing -->
    <polygon points="256,120 256,310 400,340" fill="url(#rightWing)" />
    <!-- Left Inner Keel -->
    <polygon points="112,340 216,368 256,310" fill="#0369a1" />
    <!-- Right Inner Keel -->
    <polygon points="400,340 256,310 296,368" fill="#4f46e5" />
    <!-- Center Spine Divider -->
    <line x1="256" y1="120" x2="256" y2="310" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Navigation Constellation Nodes -->
  <circle cx="256" cy="120" r="6" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="112" cy="340" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="400" cy="340" r="5" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="256" cy="310" r="4.5" fill="#e0e7ff"/>
  <circle cx="216" cy="368" r="4" fill="#38bdf8"/>
  <circle cx="296" cy="368" r="4" fill="#a855f7"/>

  <!-- Subtle Brand Monogram "JG" or text dot -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="4" text-anchor="middle">JICHANGGET.BLOG</text>
</svg>